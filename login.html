<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المدير</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f6f9;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
        }
        .login-card h2 {
            margin-top: 0;
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn-block {
            width: 100%;
            padding: 11px;
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-block:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>تسجيل دخول المدير</h2>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>اسم المستخدم:</label>
                <input type="text" id="login-username" required placeholder="أدخل اسم المستخدم">
            </div>
            <div class="form-group">
                <label>كلمة المرور:</label>
                <input type="password" id="login-password" required placeholder="أدخل كلمة المرور">
            </div>
            <button type="submit" class="btn-block">دخول</button>
        </form>
    </div>

    <script src="db.js?v=400"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;

            if (!window.db) {
                alert("خطأ: لم يتم الاتصال بـ Supabase. تأكد من ملف db.js");
                return;
            }

            try {
                // البحث عن المدير في جدول الموظفين
                const { data, error } = await db.from('employees')
                    .select('*')
                    .eq('username', username)
                    .eq('password_hash', password)
                    .eq('role', 'admin')
                    .single();

                if (error || !data) {
                    alert("اسم المستخدم أو كلمة المرور غير صحيحة، أو ليس لديك صلاحية مدير!");
                    return;
                }

                // حفظ جلسة تسجيل الدخول للمدير
                localStorage.setItem('admin_session', JSON.stringify({
                    id: data.id,
                    username: data.username,
                    full_name: data.full_name,
                    login_time: new Date().getTime()
                }));

                // التوجيه إلى لوحة التحكم
                window.location.href = 'index.html';

            } catch (err) {
                alert("حدث خطأ أثناء تسجيل الدخول: " + err.message);
            }
        }
    </script>
</body>
</html>
